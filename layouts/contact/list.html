{{ define "main" }}
<section class="section bg-gray">
  <div class="container">
    {{ with .Content }}<div class="content mb-5">{{ . }}</div>{{ end }}
    <div class="row">
      <div class="col-md-4 mb-4"><div class="contact-card"><i class="ti-mobile"></i><h5 class="mt-3">Telefon / fax</h5><a class="h5 text-color" href="tel:{{ replace site.Params.mobile " " "" }}">{{ site.Params.mobile }}</a></div></div>
      <div class="col-md-4 mb-4"><div class="contact-card"><i class="ti-email"></i><h5 class="mt-3">E-mail</h5><a class="h5 text-color" href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a></div></div>
      <div class="col-md-4 mb-4"><div class="contact-card"><i class="ti-location-pin"></i><h5 class="mt-3">Adresă</h5><p class="h5 text-color mb-0">{{ site.Params.address }}</p></div></div>
    </div>
    <ul class="list-inline mt-3">
      {{ range site.Params.social }}<li class="list-inline-item mr-3"><a class="btn btn-outline-primary" href="{{ .link }}" target="_blank" rel="noopener"><i class="{{ .icon }} mr-2"></i>{{ .title }}</a></li>{{ end }}
    </ul>
  </div>
</section>
<section>
  <iframe class="map-frame" title="Harta: Școala Gimnazială Boldu" loading="lazy" src="https://maps.google.com/maps?q={{ site.Params.map_query | urlquery }}&z=14&output=embed"></iframe>
</section>
{{ end }}
