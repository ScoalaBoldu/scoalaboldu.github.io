<article class="card rounded-0 border-bottom border-primary border-top-0 border-left-0 border-right-0 hover-shadow h-100">
  {{ with resources.Get .Params.image }}{{ $i := .Fill "640x400 webp q75 Center" }}<a href="{{ $.RelPermalink }}"><img class="card-img-top rounded-0" src="{{ $i.RelPermalink }}" alt="{{ $.Title }}" loading="lazy" width="640" height="400"></a>{{ else }}<a href="{{ .RelPermalink }}" class="card-placeholder" aria-hidden="true"><span>{{ time.Format "January" .Date }}</span><b>{{ .Date.Year }}</b></a>{{ end }}
  <div class="card-body">
    <ul class="list-inline mb-3">
      <li class="list-inline-item mr-3 ml-0"><i class="ti-calendar"></i> {{ .Params.perioada | default (partial "data.html" .Date) }}</li>
    </ul>
    <h4 class="card-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h4>
    <p class="card-text">{{ .Summary | plainify | truncate 110 }}</p>
    <a href="{{ .RelPermalink }}" class="btn btn-primary btn-sm">{{ i18n "read_more" }}</a>
  </div>
</article>
