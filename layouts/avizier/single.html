{{ define "main" }}
<section class="section">
  <div class="container">
    <div class="d-md-flex">
      <div class="text-center mr-md-4 mb-4">
        <div class="p-4 bg-primary text-white" style="min-width:150px"><span class="h2 d-block text-white">{{ .Date.Day }}</span>{{ time.Format "January 2006" .Date }}</div>
      </div>
      <div class="content flex-grow-1">
        {{ .Content }}
        {{ with .Params.fisier }}<p class="mt-4"><a href="{{ strings.TrimPrefix "/" . | relURL }}" class="btn btn-primary" target="_blank" rel="noopener"><i class="ti-download mr-2"></i>{{ i18n "download" }}</a></p>{{ end }}
        {{ with .Params.link }}<p class="mt-3"><a href="{{ . | relLangURL }}" class="btn btn-outline-primary">Mai multe detalii</a></p>{{ end }}
      </div>
    </div>
    <p class="mt-5"><a href="{{ .Parent.RelPermalink }}"><i class="ti-angle-left"></i> Înapoi la avizier</a></p>
  </div>
</section>
{{ end }}
